<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Edit Lottie and dotLottie animations in the browser: colors, layers, keyframes, timing, optimization and export to GIF, MP4, WebM and PNG."
    />
    <meta name="theme-color" content="#16171a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Lottie Editor</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('lottie-editor:prefs') || '{}').state || {}
        var t =
          p.theme === 'light' || p.theme === 'dark'
            ? p.theme
            : p.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
